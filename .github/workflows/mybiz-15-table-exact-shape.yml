name: MyBiz 15-table exact-shape RLS rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/mybiz-15-table-exact-shape.yml
      - supabase/tests/mybiz_15_table_exact_shape_fixture.sql
      - supabase/tests/mybiz_15_table_catalog_shape_assertions.sql
      - supabase/tests/mybiz_15_table_exact_shape_assertions.sql
      - supabase/tests/mybiz_15_table_rollback_assertions.sql
      - supabase/migration_drafts/20260923040856_mybiz_15_table_rls_exact_shape_candidate.sql
      - supabase/migration_drafts/20260923040858_mybiz_15_table_rls_exact_shape_rollback.sql
      - docs/mybiz/PRODUCTION_15_TABLE_*.md
      - src/shared/lib/services/mvpService.ts
      - src/shared/lib/repositories/supabaseRepository.ts
      - src/tests/public-store-rls-boundary.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-shape-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rehearsal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate application and production dependency surface
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev
      - name: Rehearse exact-shape candidate and rollback twice
        run: |
          set -euo pipefail
          docker version
          docker info --format 'Docker server: {{.ServerVersion}}'
          psql_file() {
            docker run --rm --network host -e PGPASSWORD=synthetic-test-only \
              -v "$PWD:/workspace:ro" postgres:17.6 \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d "$1" \
              -f "/workspace/$2"
          }
          psql_cmd() {
            docker run --rm --network host -e PGPASSWORD=synthetic-test-only postgres:17.6 \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d "$1" -c "$2"
          }
          for run in 1 2; do
            db="rehearsal_${run}"
            docker run --rm --network host -e PGPASSWORD=synthetic-test-only postgres:17.6 \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
              -c "CREATE DATABASE ${db}"
            psql_file "$db" supabase/tests/mybiz_15_table_exact_shape_fixture.sql
            psql_file "$db" supabase/tests/mybiz_15_table_catalog_shape_assertions.sql
            set +e
            output=$(psql_file "$db" supabase/tests/mybiz_15_table_exact_shape_assertions.sql 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ] || ! grep -q 'RLS_NOT_ENABLED' <<< "$output"; then
              echo "$output"
              echo 'Expected RLS_NOT_ENABLED baseline rejection.'
              exit 1
            fi
            echo "RED_BASELINE_TEST_${run}=PASS"
            psql_cmd "$db" "ALTER POLICY setup_requests_select_own ON public.store_setup_requests USING (true)"
            set +e
            old_drift=$(psql_file "$db" supabase/migration_drafts/20260923040856_mybiz_15_table_rls_exact_shape_candidate.sql 2>&1)
            old_drift_status=$?
            set -e
            if [ "$old_drift_status" -eq 0 ] || ! grep -q '15_TABLE_PRECONDITION_POLICY_DRIFT' <<< "$old_drift"; then
              echo 'Candidate accepted a changed original setup-request policy.'
              exit 1
            fi
            psql_cmd "$db" "ALTER POLICY setup_requests_select_own ON public.store_setup_requests USING (auth.uid() = created_by)"
            echo "OLD_POLICY_DRIFT_REJECTED_${run}=PASS"
            psql_file "$db" supabase/migration_drafts/20260923040856_mybiz_15_table_rls_exact_shape_candidate.sql
            psql_file "$db" supabase/tests/mybiz_15_table_exact_shape_assertions.sql
            psql_cmd "$db" "ALTER POLICY orders_member_select ON public.orders USING (true)"
            set +e
            policy_drift=$(psql_file "$db" supabase/migration_drafts/20260923040858_mybiz_15_table_rls_exact_shape_rollback.sql 2>&1)
            policy_drift_status=$?
            set -e
            if [ "$policy_drift_status" -eq 0 ] || ! grep -q '15_TABLE_ROLLBACK_POLICY_DRIFT' <<< "$policy_drift"; then
              echo 'Rollback accepted a changed candidate policy.'
              exit 1
            fi
            psql_cmd "$db" "ALTER POLICY orders_member_select ON public.orders USING (public.is_store_member(store_id))"
            psql_cmd "$db" "GRANT DELETE ON public.orders TO authenticated"
            set +e
            grant_drift=$(psql_file "$db" supabase/migration_drafts/20260923040858_mybiz_15_table_rls_exact_shape_rollback.sql 2>&1)
            grant_drift_status=$?
            set -e
            if [ "$grant_drift_status" -eq 0 ] || ! grep -q '15_TABLE_ROLLBACK_GRANT_DRIFT' <<< "$grant_drift"; then
              echo 'Rollback accepted a changed candidate grant.'
              exit 1
            fi
            psql_cmd "$db" "REVOKE DELETE ON public.orders FROM authenticated"
            echo "ROLLBACK_DRIFT_REJECTED_${run}=PASS"
            set +e
            replay=$(psql_file "$db" supabase/migration_drafts/20260923040856_mybiz_15_table_rls_exact_shape_candidate.sql 2>&1)
            replay_status=$?
            set -e
            if [ "$replay_status" -eq 0 ] || ! grep -q '15_TABLE_PRECONDITION' <<< "$replay"; then
              echo "$replay"
              echo 'Expected a guarded replay rejection.'
              exit 1
            fi
            echo "CANDIDATE_REPLAY_REJECTED_${run}=PASS"
            psql_file "$db" supabase/migration_drafts/20260923040858_mybiz_15_table_rls_exact_shape_rollback.sql
            psql_file "$db" supabase/tests/mybiz_15_table_rollback_assertions.sql
            echo "REHEARSAL_RUN_${run}=PASS"
          done
