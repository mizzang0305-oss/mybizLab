name: MyBiz 15-table exact-shape RLS rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/mybiz-15-table-exact-shape.yml
      - supabase/tests/mybiz_15_table_exact_shape_fixture.sql
      - supabase/tests/mybiz_15_table_exact_shape_assertions.sql
      - supabase/migration_drafts/20260923040856_mybiz_15_table_rls_exact_shape_candidate.sql
      - supabase/migration_drafts/20260923040858_mybiz_15_table_rls_exact_shape_rollback.sql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-shape-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rehearsal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Boot disposable exact-shape database
        run: |
          docker version
          docker run --rm --network host -e PGPASSWORD=synthetic-test-only \
            -v "$PWD:/workspace:ro" postgres:17.6 \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d rehearsal \
            -f /workspace/supabase/tests/mybiz_15_table_exact_shape_fixture.sql
      - name: Confirm security test rejects the unprotected baseline
        run: |
          set +e
          output=$(docker run --rm --network host -e PGPASSWORD=synthetic-test-only \
            -v "$PWD:/workspace:ro" postgres:17.6 \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d rehearsal \
            -f /workspace/supabase/tests/mybiz_15_table_exact_shape_assertions.sql 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ] || ! grep -q 'RLS_NOT_ENABLED' <<< "$output"; then
            echo "$output"
            echo 'Expected RLS_NOT_ENABLED baseline rejection.'
            exit 1
          fi
          echo 'RED_BASELINE_TEST=PASS (RLS_NOT_ENABLED)'
