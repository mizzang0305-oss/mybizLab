name: MyBiz Service OS foundation readiness

on:
  pull_request:
    branches:
      - codex/mybiz-business-service-os-r3
    paths:
      - "supabase/**"
      - "src/domain/mybiz/**"
      - "src/tests/service-os-*.test.ts"
      - "src/tests/mybiz-schema-preflight.test.ts"
      - "docs/mybiz/**"
      - ".github/workflows/mybiz-service-os-schema-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mybiz-service-os-schema-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearse-foundation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/mybiz-service-os-schema-promotion-preflight-r1')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_CLI_VERSION: 2.117.0
      PGPASSWORD: postgres
      FOUNDATION_DRAFT: supabase/migration_drafts/20260914005630_mybiz_service_os_foundation.sql

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source identity and remote isolation
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_ID:-}"
          remote_pattern='supabase[[:space:]]+(link|db[[:space:]]+(push|pull|dump)|migration[[:space:]]+(up|repair))|--link''ed|--project''-ref|--db''-url'
          if git grep -nE "$remote_pattern" -- .github/workflows/mybiz-service-os-schema-preflight.yml; then
            echo 'Forbidden remote Supabase command found.' >&2
            exit 1
          fi
          echo "FINAL_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "CI_SUPABASE_ROOT=$RUNNER_TEMP/mybiz-service-os-preflight" >> "$GITHUB_ENV"

      - name: Verify ephemeral Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Verify CLI and prepare Production-shaped baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$EXPECTED_CLI_VERSION"
          supabase start --help >/dev/null
          supabase db reset --help >/dev/null
          supabase test db --help >/dev/null
          supabase db lint --help >/dev/null
          supabase init --workdir "$CI_SUPABASE_ROOT" --yes
          mkdir -p "$CI_SUPABASE_ROOT/supabase/migrations" "$CI_SUPABASE_ROOT/supabase/tests"
          cp supabase/tests/fixtures/mybiz_service_os_production_shape.sql "$CI_SUPABASE_ROOT/supabase/migrations/20260613000000_mybiz_service_os_production_shape.sql"
          cp supabase/migrations/*.sql "$CI_SUPABASE_ROOT/supabase/migrations/"
          cp supabase/tests/mybiz_service_os_foundation_rls.sql "$CI_SUPABASE_ROOT/supabase/tests/"

      - name: Start isolated baseline and prove failed transaction leaves no partial objects
        shell: bash
        run: |
          set -euo pipefail
          supabase start --workdir "$CI_SUPABASE_ROOT" --yes
          sed '0,/^commit;$/s//select 1 \/ 0;\ncommit;/' "$FOUNDATION_DRAFT" > "$RUNNER_TEMP/foundation-known-failure.sql"
          if psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/foundation-known-failure.sql" >"$RUNNER_TEMP/failure.out" 2>&1; then
            echo 'Known-failure migration unexpectedly succeeded.' >&2
            exit 1
          fi
          grep -q 'division by zero' "$RUNNER_TEMP/failure.out"
          partial_count="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname=any(array['service_jobs','job_evidence_assets','job_evidence_revisions','job_confirmations','job_confirmation_links','consent_records','job_payment_requests','content_candidates','brand_sites','brand_site_portfolio_items','vertical_templates']);")"
          test "$partial_count" = 0
          echo 'FAILED_TRANSACTION_PARTIAL_OBJECTS=0'

      - name: Rehearsal run 1
        shell: bash
        run: |
          set -euo pipefail
          cp "$FOUNDATION_DRAFT" "$CI_SUPABASE_ROOT/supabase/migrations/20260914005630_mybiz_service_os_foundation.sql"
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          supabase migration list --local --workdir "$CI_SUPABASE_ROOT"
          supabase test db --local --workdir "$CI_SUPABASE_ROOT"
          bash supabase/tests/mybiz_service_os_foundation_revision_atomicity.sh
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select to_regclass('public.contracts') is null;")" = t
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='service_jobs' and column_name='contract_id';")" = 0
          echo 'REHEARSAL_RUN_1=PASS'

      - name: Window A rollback rehearsal
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/mybiz_service_os_foundation_down.sql
          remaining="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname=any(array['service_jobs','job_evidence_assets','job_evidence_revisions','job_confirmations','job_confirmation_links','consent_records','job_payment_requests','content_candidates','brand_sites','brand_site_portfolio_items','vertical_templates']);")"
          test "$remaining" = 0
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select to_regnamespace('private') is null;")" = t
          echo 'PRE_WRITE_ROLLBACK_READY=PASS'

      - name: Rehearsal run 2 without manual patch
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          supabase test db --local --workdir "$CI_SUPABASE_ROOT"
          bash supabase/tests/mybiz_service_os_foundation_revision_atomicity.sh
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select to_regclass('public.contracts') is null;")" = t
          echo 'REHEARSAL_RUN_2=PASS'

      - name: Verify foundation grants and lint database
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select version();"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select has_table_privilege('authenticated','public.service_jobs','INSERT');")" = f
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select has_table_privilege('authenticated','public.job_evidence_assets','INSERT');")" = f
          supabase db lint --local --workdir "$CI_SUPABASE_ROOT" --schema public,private --level warning --fail-on error

      - name: Run application regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx vitest run src/tests/mybiz-schema-preflight.test.ts src/tests/service-os-policy.test.ts src/tests/service-os-migration-contract.test.ts src/tests/service-os-db-certification-workflow.test.ts src/tests/service-os-pages.test.ts src/tests/service-os-local-object-storage.test.ts src/tests/mybiz-r3-product-truth.test.ts src/tests/homepage-r2-2.test.ts
          npm test -- --reporter=dot
          npm audit --omit=dev

      - name: Write sanitized preflight summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MyBiz Service OS foundation Production readiness R2'
            echo
            echo "- Final SHA: \`${FINAL_SHA:-unavailable}\`"
            echo "- Supabase CLI: \`${EXPECTED_CLI_VERSION}\`"
            echo '- Runtime: GitHub-hosted `ubuntu-24.04` / ephemeral Docker'
            echo '- Foundation pgTAP: 59 assertions x 2 clean rehearsals'
            echo '- Production-shape contracts relation: absent'
            echo '- Foundation contract dependency: absent'
            echo '- Live-write activation: BLOCKED_AUTH_IDENTITY_MODEL'
            echo '- Failed transaction partial objects: 0'
            echo '- Authenticated INSERT after foundation: DENIED'
            echo '- Remote project link: 0'
            echo '- Remote DB connection from CI: 0'
            echo '- Production DB mutation: 0'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy isolated stack
        if: always()
        run: supabase stop --workdir "$CI_SUPABASE_ROOT" --no-backup || true
