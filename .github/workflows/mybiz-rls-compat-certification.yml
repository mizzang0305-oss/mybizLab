name: MyBiz RLS compatibility certification

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migration_drafts/20260926_mybiz_public_rls_compat.sql"
      - "supabase/tests/mybiz_rls_compat.sql"
      - "supabase/tests/fixtures/mybiz_rls_compat_ci_baseline.sql"
      - "src/**"
      - "api/**"
      - ".github/workflows/mybiz-rls-compat-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mybiz-rls-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'security/mybiz-rls-compat-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PGPASSWORD: postgres
      EXPECTED_CLI_VERSION: 2.117.0
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify remote isolation
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_ID:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          if git grep -nE '^[[:space:]]*supabase[[:space:]]+(link|db[[:space:]]+push|migration[[:space:]]+(up|repair))|^[[:space:]]*supabase[[:space:]].*(--linked|--project-ref)' -- .github/workflows/mybiz-rls-compat-certification.yml; then
            echo 'Remote Supabase command is forbidden in this workflow.' >&2
            exit 1
          fi
          echo "CI_SUPABASE_ROOT=$RUNNER_TEMP/mybiz-rls-compat" >> "$GITHUB_ENV"

      - name: Verify ephemeral Docker
        run: |
          docker version
          docker info

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Prepare synthetic Production-like fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$EXPECTED_CLI_VERSION"
          supabase start --help >/dev/null
          supabase db reset --help >/dev/null
          supabase test db --help >/dev/null
          supabase init --workdir "$CI_SUPABASE_ROOT" --yes >/dev/null
          mkdir -p "$CI_SUPABASE_ROOT/supabase/migrations" "$CI_SUPABASE_ROOT/supabase/tests"
          cp supabase/tests/fixtures/mybiz_rls_compat_ci_baseline.sql \
            "$CI_SUPABASE_ROOT/supabase/migrations/20260925000000_mybiz_rls_compat_ci_baseline.sql"
          cp supabase/migration_drafts/20260926_mybiz_public_rls_compat.sql \
            "$CI_SUPABASE_ROOT/supabase/migrations/20260926000000_mybiz_public_rls_compat.sql"
          cp supabase/tests/mybiz_rls_compat.sql "$CI_SUPABASE_ROOT/supabase/tests/"

      - name: Start disposable Supabase and apply draft
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase start --workdir "$CI_SUPABASE_ROOT" --yes > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo 'Supabase Local failed to start; raw logs are withheld to protect local credentials.' >&2
            exit 1
          fi
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes > "$RUNNER_TEMP/supabase-reset.log" 2>&1
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select current_setting('server_version');"

      - name: Run RLS, role, and cross-store tests
        shell: bash
        run: |
          set -euo pipefail
          supabase test db --local --workdir "$CI_SUPABASE_ROOT"

      - name: Verify anonymous Data API denial
        shell: bash
        run: |
          set -euo pipefail
          supabase status --help >/dev/null
          supabase status --workdir "$CI_SUPABASE_ROOT" -o env > "$RUNNER_TEMP/supabase-status.env"
          source "$RUNNER_TEMP/supabase-status.env"
          test -n "${API_URL:-}"
          test -n "${ANON_KEY:-}"
          for method in GET POST PATCH DELETE; do
            body_args=()
            if test "$method" != GET; then body_args=(--data-binary '{}'); fi
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" \
              "$API_URL/rest/v1/orders?order_id=eq.33333333-3333-4333-8333-333333333333" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
              -H 'Content-Type: application/json' \
              "${body_args[@]}")"
            case "$code" in
              401|403) echo "anon orders $method denied ($code)" ;;
              *) echo "anon orders $method unexpected HTTP $code" >&2; exit 1 ;;
            esac
          done

      - name: Run application regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm test -- --reporter=dot

      - name: Exercise real public and merchant API handlers against disposable DB
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/supabase-status.env"
          test "${API_URL:-}" = 'http://127.0.0.1:54321'
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          export MYBIZ_CI_LOCAL_DB=1
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npx vitest run src/tests/mybiz-rls-local-api-e2e.test.ts --reporter=dot

      - name: Verify data-preserving write lockdown
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -c "insert into public.orders(order_id,store_id,total_amount) values ('33333333-3333-4333-8333-333333333333','11111111-1111-4111-8111-111111111111',123)" >/dev/null
          before="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from public.orders where order_id='33333333-3333-4333-8333-333333333333'")"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/migration_drafts/20260926_mybiz_public_rls_write_lockdown.sql >/dev/null
          after="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from public.orders where order_id='33333333-3333-4333-8333-333333333333'")"
          test "$before" = 1
          test "$after" = 1
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select has_table_privilege('service_role','public.orders','INSERT')")" = f
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select has_table_privilege('service_role','public.orders','SELECT')")" = t
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select relrowsecurity from pg_class where oid='public.orders'::regclass")" = t
          echo 'Write lockdown blocked service-role order INSERT and preserved the synthetic row.'

      - name: Write sanitized result
        if: always()
        shell: bash
        run: |
          {
            echo '## MyBiz RLS compatibility candidate'
            echo "- Candidate SHA: \`$(git rev-parse HEAD)\`"
            echo "- Draft SHA-256: \`$(sha256sum supabase/migration_drafts/20260926_mybiz_public_rls_compat.sql | cut -d' ' -f1)\`"
            echo '- Database: disposable Supabase Local on GitHub runner'
            echo '- Remote Supabase link: none'
            echo '- Production database write: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy disposable Supabase
        if: always()
        shell: bash
        run: supabase stop --workdir "$CI_SUPABASE_ROOT" --no-backup > /dev/null 2>&1 || true
