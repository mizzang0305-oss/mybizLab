name: MyBiz 15-table Supabase HTTP R2 rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/mybiz-15-table-fullstack-r2.yml
      - scripts/security/mybiz-15-table-data-api.mjs
      - scripts/security/run-mybiz-15-table-fullstack.sh
      - supabase/tests/mybiz_15_table_exact_shape_fixture.sql
      - supabase/tests/mybiz_15_table_fullstack_support.sql
      - supabase/live_patches/20260318_fix_create_store_with_owner_live.sql
      - supabase/migration_drafts/20260923040856_mybiz_15_table_rls_exact_shape_candidate.sql
      - supabase/migration_drafts/20260923040858_mybiz_15_table_rls_exact_shape_rollback.sql
      - docs/mybiz/PRODUCTION_15_TABLE_*.md
      - docs/mybiz/PRODUCTION_RPC_EXPOSURE_AUDIT.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0
      - name: Verify local-only tools and CLI commands
        run: |
          supabase --version
          supabase --help >/dev/null
          supabase start --help >/dev/null
          supabase test db --help >/dev/null
          supabase db advisors --help >/dev/null
          psql --version
          docker version
          docker info --format 'Docker server {{.ServerVersion}}'
      - name: Install locked application dependencies
        run: npm ci
      - name: Rehearse actual local Auth, PostgREST, gateway, candidate and rollback twice
        run: bash scripts/security/run-mybiz-15-table-fullstack.sh
