name: MyBiz Service OS Stage 2 identity policy alignment

on:
  push:
    branches:
      - codex/mybiz-service-os-stage2-identity-policy-alignment-r1
    paths:
      - "supabase/**"
      - "src/tests/mybiz-stage2-identity-policy-alignment.test.ts"
      - ".github/workflows/mybiz-service-os-stage2-identity-policy-alignment.yml"
  pull_request:
    branches:
      - codex/mybiz-service-os-auth-identity-readiness-r1
    paths:
      - "supabase/**"
      - "src/tests/mybiz-stage2-identity-policy-alignment.test.ts"
      - ".github/workflows/mybiz-service-os-stage2-identity-policy-alignment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mybiz-service-os-stage2-identity-policy-alignment-r1
  cancel-in-progress: true

jobs:
  rehearse-policy-alignment:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/mybiz-service-os-stage2-identity-policy-alignment-r1') ||
      github.ref == 'refs/heads/codex/mybiz-service-os-stage2-identity-policy-alignment-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_CLI_VERSION: 2.117.0
      PGPASSWORD: postgres
      FOUNDATION_DRAFT: supabase/migration_drafts/20260914005630_mybiz_service_os_foundation.sql
      GLOBAL_POLICY_SHAPE: supabase/tests/fixtures/mybiz_service_os_policy_alignment_global_dependency_shape.sql
      AUTH_SHAPE: supabase/tests/fixtures/mybiz_service_os_auth_identity_production_shape.sql
      AUTH_FOUNDATION_DRAFT: supabase/migration_drafts/20260914091947_mybiz_service_os_auth_identity_foundation.sql
      POLICY_ALIGNMENT_DRAFT: supabase/migration_drafts/20260914091951_mybiz_service_os_stage2_identity_policy_alignment.sql
      POLICY_ALIGNMENT_ROLLBACK: supabase/tests/fixtures/mybiz_service_os_stage2_identity_policy_alignment_down.sql

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source identity and remote isolation
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_ID:-}"
          remote_pattern='supabase[[:space:]]+(link|db[[:space:]]+(push|pull|dump)|migration[[:space:]]+(up|repair))|--link''ed|--project''-ref|--db''-url'
          if git grep -nE "$remote_pattern" -- .github/workflows/mybiz-service-os-stage2-identity-policy-alignment.yml; then
            echo 'Forbidden remote Supabase command found.' >&2
            exit 1
          fi
          echo "FINAL_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "CI_SUPABASE_ROOT=$RUNNER_TEMP/mybiz-policy-alignment-r1" >> "$GITHUB_ENV"

      - name: Verify ephemeral Docker runtime
        run: |
          docker version
          docker info

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Prepare clean Foundation and Auth Identity baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$EXPECTED_CLI_VERSION"
          supabase start --help >/dev/null
          supabase db reset --help >/dev/null
          supabase test db --help >/dev/null
          supabase db lint --help >/dev/null
          supabase init --workdir "$CI_SUPABASE_ROOT" --yes
          mkdir -p "$CI_SUPABASE_ROOT/supabase/migrations" "$CI_SUPABASE_ROOT/supabase/tests"
          cp supabase/tests/fixtures/mybiz_service_os_production_shape.sql "$CI_SUPABASE_ROOT/supabase/migrations/20260613000000_mybiz_service_os_production_shape.sql"
          cp "$GLOBAL_POLICY_SHAPE" "$CI_SUPABASE_ROOT/supabase/migrations/20260613000001_mybiz_service_os_policy_alignment_global_dependency_shape.sql"
          cp supabase/migrations/*.sql "$CI_SUPABASE_ROOT/supabase/migrations/"
          cp "$FOUNDATION_DRAFT" "$CI_SUPABASE_ROOT/supabase/migrations/20260914005630_mybiz_service_os_foundation.sql"
          cp "$AUTH_SHAPE" "$CI_SUPABASE_ROOT/supabase/migrations/20260914091946_mybiz_service_os_auth_identity_shape.sql"
          cp "$AUTH_FOUNDATION_DRAFT" "$CI_SUPABASE_ROOT/supabase/migrations/20260914091947_mybiz_service_os_auth_identity_foundation.sql"

      - name: Start clean stack and capture old-policy baseline
        shell: bash
        run: |
          set -euo pipefail
          supabase start --workdir "$CI_SUPABASE_ROOT" --yes
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          old_count="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policies where schemaname='public' and policyname=any(array['service_jobs_member_select','evidence_assets_member_select','evidence_revisions_member_select','confirmations_member_select','consent_records_member_select','payment_requests_member_select','content_candidates_member_select','brand_sites_member_select','portfolio_items_member_select']) and regexp_replace(coalesce(qual,''),'[[:space:]()]','','g')=any(array['is_store_memberstore_id','public.is_store_memberstore_id']);")"
          new_count="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policies where schemaname='public' and policyname=any(array['service_jobs_member_select','evidence_assets_member_select','evidence_revisions_member_select','confirmations_member_select','consent_records_member_select','payment_requests_member_select','content_candidates_member_select','brand_sites_member_select','portfolio_items_member_select']) and regexp_replace(coalesce(qual,''),'[[:space:]()]','','g')=any(array['is_service_os_store_memberstore_id','private.is_service_os_store_memberstore_id']);")"
          global_dependencies="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and (position('is_store_member' in coalesce(pg_get_expr(p.polqual,p.polrelid),''))>0 or position('is_store_member' in coalesce(pg_get_expr(p.polwithcheck,p.polrelid),''))>0);")"
          echo "OLD_RESOLVER_POLICY_COUNT=$old_count"
          echo "NEW_RESOLVER_POLICY_COUNT=$new_count"
          echo "GLOBAL_IS_STORE_MEMBER_DEPENDENCIES=$global_dependencies"
          test "$old_count" = 9
          test "$new_count" = 0
          test "$global_dependencies" = 42
          echo "GLOBAL_HASH_BEFORE=$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(pg_get_functiondef('public.is_store_member(uuid)'::regprocedure));")" >> "$GITHUB_ENV"
          echo "UNRELATED_POLICY_HASH_BEFORE=$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(string_agg(policyname||'|'||tablename||'|'||cmd||'|'||array_to_string(roles,',')||'|'||coalesce(qual,'')||'|'||coalesce(with_check,''),E'\\n' order by schemaname,tablename,policyname,cmd)) from pg_policies where schemaname='public' and policyname not in ('service_jobs_member_select','evidence_assets_member_select','evidence_revisions_member_select','confirmations_member_select','consent_records_member_select','payment_requests_member_select','content_candidates_member_select','brand_sites_member_select','portfolio_items_member_select');")" >> "$GITHUB_ENV"

      - name: Stage alignment candidate and CI-only tests
        shell: bash
        run: |
          set -euo pipefail
          cp "$POLICY_ALIGNMENT_DRAFT" "$CI_SUPABASE_ROOT/supabase/migrations/20260914091951_mybiz_service_os_stage2_identity_policy_alignment.sql"
          cp supabase/tests/mybiz_service_os_foundation_rls.sql "$CI_SUPABASE_ROOT/supabase/tests/"
          cp supabase/tests/mybiz_service_os_auth_identity_rls.sql "$CI_SUPABASE_ROOT/supabase/tests/"
          cp supabase/tests/mybiz_service_os_stage2_identity_policy_alignment_rls.sql "$CI_SUPABASE_ROOT/supabase/tests/"

      - name: Rehearsal run 1 and accidental-rerun guard
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          supabase test db --local --workdir "$CI_SUPABASE_ROOT"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policies where schemaname='public' and policyname=any(array['service_jobs_member_select','evidence_assets_member_select','evidence_revisions_member_select','confirmations_member_select','consent_records_member_select','payment_requests_member_select','content_candidates_member_select','brand_sites_member_select','portfolio_items_member_select']) and regexp_replace(coalesce(qual,''),'[[:space:]()]','','g')=any(array['is_service_os_store_memberstore_id','private.is_service_os_store_memberstore_id']);")" = 9
          if psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$POLICY_ALIGNMENT_DRAFT" >"$RUNNER_TEMP/alignment-rerun.log" 2>&1; then
            echo 'Policy alignment rerun unexpectedly succeeded.' >&2
            exit 1
          fi
          grep -q 'STAGE2_IDENTITY_POLICY_ALIGNMENT_EXACT_OLD_STATE_REQUIRED' "$RUNNER_TEMP/alignment-rerun.log"
          echo 'POLICY_ALIGNMENT_REHEARSAL_RUN_1=PASS'

      - name: Policy-only rollback rehearsal
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$POLICY_ALIGNMENT_ROLLBACK"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policies where schemaname='public' and policyname=any(array['service_jobs_member_select','evidence_assets_member_select','evidence_revisions_member_select','confirmations_member_select','consent_records_member_select','payment_requests_member_select','content_candidates_member_select','brand_sites_member_select','portfolio_items_member_select']) and regexp_replace(coalesce(qual,''),'[[:space:]()]','','g')=any(array['is_store_memberstore_id','public.is_store_memberstore_id']);")" = 9
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policies where schemaname='public' and policyname=any(array['service_jobs_member_select','evidence_assets_member_select','evidence_revisions_member_select','confirmations_member_select','consent_records_member_select','payment_requests_member_select','content_candidates_member_select','brand_sites_member_select','portfolio_items_member_select']) and regexp_replace(coalesce(qual,''),'[[:space:]()]','','g')=any(array['is_service_os_store_memberstore_id','private.is_service_os_store_memberstore_id']);")" = 0
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and (position('is_store_member' in coalesce(pg_get_expr(p.polqual,p.polrelid),''))>0 or position('is_store_member' in coalesce(pg_get_expr(p.polwithcheck,p.polrelid),''))>0);")" = 42
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(pg_get_functiondef('public.is_store_member(uuid)'::regprocedure));")" = "$GLOBAL_HASH_BEFORE"
          echo 'POLICY_ALIGNMENT_ROLLBACK=PASS'

      - name: Rehearsal run 2 and independent postcheck
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          supabase test db --local --workdir "$CI_SUPABASE_ROOT" "$CI_SUPABASE_ROOT/supabase/tests/mybiz_service_os_stage2_identity_policy_alignment_rls.sql"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policies where schemaname='public' and policyname=any(array['service_jobs_member_select','evidence_assets_member_select','evidence_revisions_member_select','confirmations_member_select','consent_records_member_select','payment_requests_member_select','content_candidates_member_select','brand_sites_member_select','portfolio_items_member_select']) and regexp_replace(coalesce(qual,''),'[[:space:]()]','','g')=any(array['is_service_os_store_memberstore_id','private.is_service_os_store_memberstore_id']);")" = 9
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and (position('is_store_member' in coalesce(pg_get_expr(p.polqual,p.polrelid),''))>0 or position('is_store_member' in coalesce(pg_get_expr(p.polwithcheck,p.polrelid),''))>0);")" = 33
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(pg_get_functiondef('public.is_store_member(uuid)'::regprocedure));")" = "$GLOBAL_HASH_BEFORE"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(string_agg(policyname||'|'||tablename||'|'||cmd||'|'||array_to_string(roles,',')||'|'||coalesce(qual,'')||'|'||coalesce(with_check,''),E'\\n' order by schemaname,tablename,policyname,cmd)) from pg_policies where schemaname='public' and policyname not in ('service_jobs_member_select','evidence_assets_member_select','evidence_revisions_member_select','confirmations_member_select','consent_records_member_select','payment_requests_member_select','content_candidates_member_select','brand_sites_member_select','portfolio_items_member_select');")" = "$UNRELATED_POLICY_HASH_BEFORE"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from information_schema.role_table_grants where table_schema='public' and grantee='authenticated' and table_name in ('service_jobs','job_evidence_assets','job_evidence_revisions','job_confirmations','job_confirmation_links','consent_records','job_payment_requests','content_candidates','brand_sites','brand_site_portfolio_items','vertical_templates') and privilege_type in ('INSERT','UPDATE','DELETE');")" = 0
          echo 'POLICY_ALIGNMENT_REHEARSAL_RUN_2=PASS'

      - name: Lint isolated database
        shell: bash
        run: supabase db lint --local --workdir "$CI_SUPABASE_ROOT" --schema public,private,core --level warning --fail-on error

      - name: Run application regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx vitest run src/tests/mybiz-stage2-identity-policy-alignment.test.ts src/tests/mybiz-auth-identity-foundation.test.ts src/tests/service-os-policy.test.ts src/tests/service-os-migration-contract.test.ts
          npm test -- --reporter=dot
          npm audit --omit=dev

      - name: Write sanitized alignment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MyBiz Service OS Stage 2 Identity Policy Alignment'
            echo
            echo "- Final SHA: \`${FINAL_SHA:-unavailable}\`"
            echo "- Supabase CLI: \`${EXPECTED_CLI_VERSION}\`"
            echo '- Runtime: GitHub-hosted `ubuntu-24.04` / ephemeral Docker'
            echo '- Target policies: 9 SELECT policies only'
            echo '- Global helper dependencies: 42 to 33'
            echo '- Global helper mutation: false'
            echo '- Live-write activation: false'
            echo '- Remote project link: 0'
            echo '- Remote DB connection from CI: 0'
            echo '- Production DB mutation from CI: 0'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy isolated stack
        if: always()
        run: supabase stop --workdir "$CI_SUPABASE_ROOT" --no-backup || true
