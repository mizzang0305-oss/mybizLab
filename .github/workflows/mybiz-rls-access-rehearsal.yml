name: MyBiz isolated RLS access rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/mybiz-rls-access-rehearsal.yml
      - supabase/tests/mybiz_legacy_rls_access_rehearsal.sql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rehearsal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm isolated runner and Postgres version
        run: |
          docker version
          docker info --format 'Docker server: {{.ServerVersion}}'
          docker run --rm --network host -e PGPASSWORD=synthetic-test-only postgres:17.6 \
            psql -X -A -t -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d rehearsal \
            -c 'select version()'
      - name: Rehearse access matrix twice from a clean transaction
        run: |
          for run in 1 2; do
            echo "SYNTHETIC_REHEARSAL_RUN=${run}"
            docker run --rm --network host \
              -e PGPASSWORD=synthetic-test-only \
              -v "$PWD:/workspace:ro" postgres:17.6 \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d rehearsal \
              -f /workspace/supabase/tests/mybiz_legacy_rls_access_rehearsal.sql
          done
