name: MyBiz Stage 2 database certification

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "api/stores/provision.ts"
      - "src/modules/onboarding/page.tsx"
      - "src/shared/lib/launchGates.ts"
      - "src/tests/api-stores-provision.test.ts"
      - "src/tests/launch-gates.test.ts"
      - "src/tests/mybiz-rls-local-api-e2e.test.ts"
      - "src/domain/mybiz/**"
      - "src/tests/service-os-*.test.ts"
      - "docs/MYBIZ_STAGE2_VERIFICATION.md"
      - ".github/workflows/mybiz-stage2-db-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mybiz-stage2-db-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-stage2-database:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.pull_request.number == 175 &&
         github.head_ref == 'codex/mybiz-stage2-r2-hardening') ||
        (github.event.pull_request.number == 190 &&
         github.head_ref == 'codex/mybiz-production-canonical-v1')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_CLI_VERSION: 2.117.0
      PGPASSWORD: postgres

    steps:
      - name: Check out exact pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source identity and remote isolation
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_ID:-}"
          remote_command_pattern='supabase[[:space:]]+(link|db[[:space:]]+push|migration[[:space:]]+repair)'
          remote_flag_pattern='--link''ed|--project''-ref|--db''-url'
          if git grep -nE "$remote_command_pattern|$remote_flag_pattern" -- .github/workflows/mybiz-stage2-db-certification.yml; then
            echo 'Forbidden remote Supabase command found in certification workflow.' >&2
            exit 1
          fi
          echo "FINAL_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "CI_SUPABASE_ROOT=$RUNNER_TEMP/mybiz-stage2-db" >> "$GITHUB_ENV"

      - name: Verify ephemeral Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Verify CLI commands and prepare isolated test
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$EXPECTED_CLI_VERSION"
          supabase start --help >/dev/null
          supabase db reset --help >/dev/null
          supabase migration up --help >/dev/null
          supabase test db --help >/dev/null
          supabase db lint --help >/dev/null
          supabase init --workdir "$CI_SUPABASE_ROOT" --yes
          mkdir -p "$CI_SUPABASE_ROOT/supabase/tests" "$CI_SUPABASE_ROOT/supabase/migrations"
          # Only the marker may run before the current-state application baseline.
          cp supabase/migrations/20260614_production_baseline_adoption.sql "$CI_SUPABASE_ROOT/supabase/migrations/"
          # The current-state baseline is a pg_dump script with psql meta commands.
          # Apply it with psql after local bootstrap, not as a Supabase migration.
          cp supabase/tests/mybiz_stage2_service_os_rls.sql "$CI_SUPABASE_ROOT/supabase/tests/"
          cp supabase/tests/mybiz_rls_compat.sql "$CI_SUPABASE_ROOT/supabase/tests/"

      - name: Start ephemeral Supabase stack and reset database
        shell: bash
        run: |
          set -euo pipefail
          supabase start --workdir "$CI_SUPABASE_ROOT" --yes
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          psql -X -1 -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/baselines/current_production_schema_v1/current_schema_candidate_v4.sql
          cp supabase/migrations/20260928232001_service_os_verified_identity_resolver.sql \
            "$CI_SUPABASE_ROOT/supabase/migrations/"
          supabase migration up --local --workdir "$CI_SUPABASE_ROOT"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -c "notify pgrst, 'reload schema';"
          versions="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc \
            "select string_agg(version, ',' order by version) from supabase_migrations.schema_migrations")"
          test "$versions" = '20260614,20260928232001'
          supabase migration list --local --workdir "$CI_SUPABASE_ROOT"
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc 'select version();'

      - name: Run Stage 2 pgTAP enforcement matrix
        shell: bash
        run: |
          set -euo pipefail
          supabase test db --local --workdir "$CI_SUPABASE_ROOT"

      - name: Verify revision atomicity under contention
        shell: bash
        run: |
          set -euo pipefail
          bash supabase/tests/mybiz_stage2_revision_atomicity.sh

      - name: Lint ephemeral database
        shell: bash
        run: |
          set -euo pipefail
          lint_file="$RUNNER_TEMP/mybiz-stage2-db-lint.json"
          supabase db lint --local --workdir "$CI_SUPABASE_ROOT" --schema public,private --level warning --fail-on none --output json > "$lint_file"
          node --input-type=module - "$lint_file" <<'NODE'
          import { readFileSync } from 'node:fs';
          const findings = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(findings)) throw new Error('DB_LINT_INVALID_OUTPUT');
          if (findings.length === 0) {
            process.stdout.write('DB_LINT=PASS_ZERO_FINDINGS\n');
          } else if (
            findings.length === 1 &&
            findings[0].function === 'public.create_store_with_owner' &&
            findings[0].issues?.length === 1 &&
            findings[0].issues[0].sqlState === '42702' &&
            findings[0].issues[0].message === 'column reference "store_id" is ambiguous'
          ) {
            process.stdout.write('DB_LINT=KNOWN_LEGACY_HOLD_FUNCTION_ONLY\n');
          } else {
            throw new Error('DB_LINT_UNEXPECTED_FINDING');
          }
          NODE
          exposed_count="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc \
            "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace \
             where n.nspname='public' and p.proname='create_store_with_owner' \
               and (has_function_privilege('anon',p.oid,'EXECUTE') \
                    or has_function_privilege('authenticated',p.oid,'EXECUTE') \
                    or has_function_privilege('service_role',p.oid,'EXECUTE'))")"
          test "$exposed_count" = 0

      - name: Install application dependencies
        run: npm ci

      - name: Exercise verified identity and merchant APIs against disposable Supabase
        shell: bash
        run: |
          set -euo pipefail
          status_json="$(supabase status --workdir "$CI_SUPABASE_ROOT" --output json)"
          api_url="$(jq -r '.API_URL' <<< "$status_json")"
          test "$api_url" = 'http://127.0.0.1:54321'
          export SUPABASE_URL="$api_url"
          export SUPABASE_ANON_KEY="$(jq -r '.ANON_KEY' <<< "$status_json")"
          export SUPABASE_SERVICE_ROLE_KEY="$(jq -r '.SERVICE_ROLE_KEY' <<< "$status_json")"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          export MYBIZ_CI_LOCAL_DB=1
          npx vitest run src/tests/mybiz-rls-local-api-e2e.test.ts \
            src/tests/supabase-user-context-identity.test.ts --reporter=dot

      - name: Run application quality gates
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run build
          npx vitest run src/tests/service-os-policy.test.ts src/tests/service-os-migration-contract.test.ts src/tests/service-os-db-certification-workflow.test.ts src/tests/service-os-pages.test.ts src/tests/service-os-local-object-storage.test.ts src/tests/marketing-pages.test.ts
          npm test -- --reporter=dot
          npm audit --omit=dev

      - name: Write sanitized certification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MyBiz Stage 2 database certification'
            echo
            echo "- Final SHA: \`${FINAL_SHA:-unavailable}\`"
            echo "- Supabase CLI: \`${EXPECTED_CLI_VERSION}\`"
            echo '- Runtime: GitHub-hosted `ubuntu-24.04` / ephemeral Docker'
            echo '- Schema source: current Production application baseline candidate applied to isolated local DB with psql'
            echo '- pgTAP plan: 79 assertions (Stage 2 48; security 31) against current Production contract'
            echo '- Remote project link: 0'
            echo '- Remote DB connection: 0'
            echo '- Remote SQL execution: 0'
            echo '- Production DB mutation: 0'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy ephemeral Supabase stack
        if: always()
        shell: bash
        run: supabase stop --workdir "$CI_SUPABASE_ROOT" --no-backup || true
