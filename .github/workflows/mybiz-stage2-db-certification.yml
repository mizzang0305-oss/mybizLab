name: MyBiz Stage 2 database certification

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "src/domain/mybiz/**"
      - "src/tests/service-os-*.test.ts"
      - ".github/workflows/mybiz-stage2-db-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mybiz-stage2-db-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-stage2-database:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.number == 175 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/mybiz-stage2-r2-hardening')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_SUPABASE_ROOT: ${{ runner.temp }}/mybiz-stage2-db
      EXPECTED_CLI_VERSION: 2.117.0
      PGPASSWORD: postgres

    steps:
      - name: Check out exact pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify source identity and remote isolation
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_ID:-}"
          remote_command_pattern='supabase[[:space:]]+(link|db[[:space:]]+push|migration[[:space:]]+(up|repair))'
          remote_flag_pattern='--link''ed|--project''-ref'
          if git grep -nE "$remote_command_pattern|$remote_flag_pattern" -- .github/workflows/mybiz-stage2-db-certification.yml; then
            echo 'Forbidden remote Supabase command found in certification workflow.' >&2
            exit 1
          fi
          echo "FINAL_SHA=$actual_sha" >> "$GITHUB_ENV"

      - name: Verify ephemeral Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Verify CLI commands and prepare CI-only migrations
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$EXPECTED_CLI_VERSION"
          supabase start --help >/dev/null
          supabase db reset --help >/dev/null
          supabase test db --help >/dev/null
          supabase db lint --help >/dev/null
          supabase init --workdir "$CI_SUPABASE_ROOT" --yes
          mkdir -p "$CI_SUPABASE_ROOT/supabase/migrations" "$CI_SUPABASE_ROOT/supabase/tests"
          cp supabase/tests/fixtures/mybiz_stage2_ci_baseline.sql "$CI_SUPABASE_ROOT/supabase/migrations/20260613000000_mybiz_stage2_ci_baseline.sql"
          cp supabase/migrations/*.sql "$CI_SUPABASE_ROOT/supabase/migrations/"
          cp supabase/migration_drafts/20260913083614_mybiz_stage2_service_os.sql "$CI_SUPABASE_ROOT/supabase/migrations/20260913083614_mybiz_stage2_service_os.sql"
          cp supabase/tests/mybiz_stage2_service_os_rls.sql "$CI_SUPABASE_ROOT/supabase/tests/"
          printf 'CI-only migration order:\n'
          find "$CI_SUPABASE_ROOT/supabase/migrations" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Start ephemeral Supabase stack and reset database
        shell: bash
        run: |
          set -euo pipefail
          supabase start --workdir "$CI_SUPABASE_ROOT" --yes
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          supabase migration list --local --workdir "$CI_SUPABASE_ROOT"
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc 'select version();'

      - name: Run Stage 2 pgTAP enforcement matrix
        shell: bash
        run: |
          set -euo pipefail
          supabase test db --local --workdir "$CI_SUPABASE_ROOT"

      - name: Verify revision atomicity under contention
        shell: bash
        run: |
          set -euo pipefail
          bash supabase/tests/mybiz_stage2_revision_atomicity.sh

      - name: Lint ephemeral database
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --local --workdir "$CI_SUPABASE_ROOT" --schema public,private --level warning --fail-on error

      - name: Install application dependencies
        run: npm ci

      - name: Run application quality gates
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run build
          npx vitest run src/tests/service-os-policy.test.ts src/tests/service-os-migration-contract.test.ts src/tests/service-os-db-certification-workflow.test.ts src/tests/service-os-pages.test.ts src/tests/service-os-local-object-storage.test.ts src/tests/marketing-pages.test.ts
          npm test -- --reporter=dot
          npm audit --omit=dev

      - name: Write sanitized certification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MyBiz Stage 2 database certification'
            echo
            echo "- Final SHA: \`${FINAL_SHA:-unavailable}\`"
            echo "- Supabase CLI: \`${EXPECTED_CLI_VERSION}\`"
            echo '- Runtime: GitHub-hosted `ubuntu-24.04` / ephemeral Docker'
            echo '- Migration source: repository baseline fixture + active migration chain + CI-only staged Stage 2 draft'
            echo '- pgTAP plan: 25 assertions'
            echo '- Remote project link: 0'
            echo '- Remote DB connection: 0'
            echo '- Remote SQL execution: 0'
            echo '- Production DB mutation: 0'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy ephemeral Supabase stack
        if: always()
        shell: bash
        run: supabase stop --workdir "$CI_SUPABASE_ROOT" --no-backup || true
