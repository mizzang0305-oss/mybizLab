name: MyBiz Service OS auth identity readiness

on:
  pull_request:
    branches:
      - codex/mybiz-service-os-schema-promotion-preflight-r1
    paths:
      - "supabase/**"
      - "src/tests/mybiz-auth-identity-foundation.test.ts"
      - "docs/mybiz/**"
      - ".github/workflows/mybiz-service-os-auth-identity-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mybiz-service-os-auth-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearse-auth-identity:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/mybiz-service-os-auth-identity-readiness-r1')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_CLI_VERSION: 2.117.0
      PGPASSWORD: postgres
      FOUNDATION_DRAFT: supabase/migration_drafts/20260914005630_mybiz_service_os_foundation.sql
      AUTH_SHAPE: supabase/tests/fixtures/mybiz_service_os_auth_identity_production_shape.sql
      AUTH_FOUNDATION_DRAFT: supabase/migration_drafts/20260914091947_mybiz_service_os_auth_identity_foundation.sql
      POLICY_ALIGNMENT_DRAFT: supabase/migration_drafts/20260914091951_mybiz_service_os_stage2_identity_policy_alignment.sql

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source identity and remote isolation
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_ID:-}"
          remote_pattern='supabase[[:space:]]+(link|db[[:space:]]+(push|pull|dump)|migration[[:space:]]+(up|repair))|--link''ed|--project''-ref|--db''-url'
          if git grep -nE "$remote_pattern" -- .github/workflows/mybiz-service-os-auth-identity-readiness.yml; then
            echo 'Forbidden remote Supabase command found.' >&2
            exit 1
          fi
          echo "FINAL_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "CI_SUPABASE_ROOT=$RUNNER_TEMP/mybiz-auth-identity-r1" >> "$GITHUB_ENV"

      - name: Verify ephemeral Docker runtime
        run: |
          docker version
          docker info

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Prepare isolated Foundation baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$EXPECTED_CLI_VERSION"
          supabase start --help >/dev/null
          supabase db reset --help >/dev/null
          supabase test db --help >/dev/null
          supabase db lint --help >/dev/null
          supabase init --workdir "$CI_SUPABASE_ROOT" --yes
          mkdir -p "$CI_SUPABASE_ROOT/supabase/migrations" "$CI_SUPABASE_ROOT/supabase/tests"
          cp supabase/tests/fixtures/mybiz_service_os_production_shape.sql "$CI_SUPABASE_ROOT/supabase/migrations/20260613000000_mybiz_service_os_production_shape.sql"
          cp supabase/migrations/*.sql "$CI_SUPABASE_ROOT/supabase/migrations/"
          cp "$FOUNDATION_DRAFT" "$CI_SUPABASE_ROOT/supabase/migrations/20260914005630_mybiz_service_os_foundation.sql"

      - name: Start isolated stack and capture unchanged global baseline
        shell: bash
        run: |
          set -euo pipefail
          supabase start --workdir "$CI_SUPABASE_ROOT" --yes
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          global_hash="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(pg_get_functiondef('public.is_store_member(uuid)'::regprocedure));")"
          global_dependencies="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policies where schemaname='public' and coalesce(qual,'') like '%is_store_member%';")"
          echo "GLOBAL_HASH_BEFORE=$global_hash" >> "$GITHUB_ENV"
          echo "GLOBAL_DEPENDENCIES_BEFORE=$global_dependencies" >> "$GITHUB_ENV"

      - name: Stage sanitized Auth shape and capture canonical trigger
        shell: bash
        run: |
          set -euo pipefail
          cp "$AUTH_SHAPE" "$CI_SUPABASE_ROOT/supabase/migrations/20260914091946_mybiz_service_os_auth_identity_shape.sql"
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          core_trigger_hash="$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(pg_get_functiondef('core.handle_auth_user_created()'::regprocedure));")"
          test -n "$core_trigger_hash"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select to_regclass('private.profile_auth_bindings') is null;")" = t
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from public.store_members where store_id::text like '93000000-%';")" = 7
          echo "CORE_TRIGGER_HASH_BEFORE=$core_trigger_hash" >> "$GITHUB_ENV"

      - name: Stage Auth candidates only inside ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          cp "$AUTH_FOUNDATION_DRAFT" "$CI_SUPABASE_ROOT/supabase/migrations/20260914091947_mybiz_service_os_auth_identity_foundation.sql"
          cp "$POLICY_ALIGNMENT_DRAFT" "$CI_SUPABASE_ROOT/supabase/migrations/20260914091951_mybiz_service_os_stage2_identity_policy_alignment.sql"
          cp supabase/tests/mybiz_service_os_foundation_rls.sql "$CI_SUPABASE_ROOT/supabase/tests/"
          cp supabase/tests/mybiz_service_os_auth_identity_rls.sql "$CI_SUPABASE_ROOT/supabase/tests/"

      - name: Rehearsal run 1
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          supabase migration list --local --workdir "$CI_SUPABASE_ROOT"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(pg_get_functiondef('public.is_store_member(uuid)'::regprocedure));")" = "$GLOBAL_HASH_BEFORE"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(pg_get_functiondef('core.handle_auth_user_created()'::regprocedure));")" = "$CORE_TRIGGER_HASH_BEFORE"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from private.profile_auth_bindings;")" = 2
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from public.store_members where store_id::text like '93000000-%';")" = 7
          supabase test db --local --workdir "$CI_SUPABASE_ROOT"
          echo 'IDENTITY_REHEARSAL_RUN_1=PASS'

      - name: Auth-only Window A rollback rehearsal
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/mybiz_service_os_auth_identity_down.sql
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select to_regclass('private.profile_auth_bindings') is null;")" = t
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select to_regprocedure('private.current_service_os_business_profile_id()') is null;")" = t
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select to_regclass('public.service_jobs') is not null;")" = t
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select to_regprocedure('private.consume_job_confirmation_link(text,text,text,jsonb)') is not null;")" = t
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(pg_get_functiondef('public.is_store_member(uuid)'::regprocedure));")" = "$GLOBAL_HASH_BEFORE"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select count(*) from pg_policies where schemaname='public' and coalesce(qual,'') like '%is_store_member%';")" = "$GLOBAL_DEPENDENCIES_BEFORE"
          echo 'GLOBAL_POLICY_DEPENDENCY_EXPECTED_EQUAL=PASS'
          echo 'AUTH_WINDOW_A_ROLLBACK=PASS'

      - name: Rehearsal run 2
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --workdir "$CI_SUPABASE_ROOT" --no-seed --yes
          supabase test db --local --workdir "$CI_SUPABASE_ROOT" "$CI_SUPABASE_ROOT/supabase/tests/mybiz_service_os_auth_identity_rls.sql"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select md5(pg_get_functiondef('public.is_store_member(uuid)'::regprocedure));")" = "$GLOBAL_HASH_BEFORE"
          echo 'IDENTITY_REHEARSAL_RUN_2=PASS'

      - name: Lint database and prove live writes remain closed
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select version();"
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select has_table_privilege('authenticated','public.service_jobs','INSERT');")" = f
          test "$(psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select has_table_privilege('authenticated','public.job_evidence_assets','INSERT');")" = f
          supabase db lint --local --workdir "$CI_SUPABASE_ROOT" --schema public,private,core --level warning --fail-on error

      - name: Run application regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx vitest run src/tests/mybiz-auth-identity-foundation.test.ts src/tests/mybiz-schema-preflight.test.ts src/tests/service-os-policy.test.ts src/tests/service-os-migration-contract.test.ts src/tests/service-os-db-certification-workflow.test.ts src/tests/service-os-pages.test.ts src/tests/service-os-local-object-storage.test.ts src/tests/mybiz-r3-product-truth.test.ts src/tests/homepage-r2-2.test.ts
          npm test -- --reporter=dot
          npm audit --omit=dev

      - name: Write sanitized readiness summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MyBiz Service OS Auth Identity Foundation Readiness R1'
            echo
            echo "- Final SHA: \`${FINAL_SHA:-unavailable}\`"
            echo "- Supabase CLI: \`${EXPECTED_CLI_VERSION}\`"
            echo '- Runtime: GitHub-hosted `ubuntu-24.04` / ephemeral Docker'
            echo '- Auth identity pgTAP: 52 assertions x 2 clean rehearsals'
            echo '- Foundation pgTAP regression: 59 assertions x 1'
            echo '- Exact-ID binding seed: 2'
            echo '- Legacy unbound profiles: 1'
            echo '- Legacy unbound memberships: 6'
            echo '- Global membership function changed: false'
            echo '- Service OS live write enabled: false'
            echo '- Remote project link: 0'
            echo '- Remote DB connection from CI: 0'
            echo '- Production DB mutation: 0'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy isolated stack
        if: always()
        run: supabase stop --workdir "$CI_SUPABASE_ROOT" --no-backup || true
